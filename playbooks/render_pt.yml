---
- name: Generar archivos de configuracion para Packet Tracer
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Crear carpeta de salida
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../rendered"
        state: directory
        mode: "0755"

    - name: Cargar variables del Switch y renderizar plantilla
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/switches.yml"

    - name: Generar archivo de configuracion del Switch
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/switch_c9200l.j2"
        dest: "{{ playbook_dir }}/../rendered/switch_pt.cfg"
        mode: "0644"

    - name: Cargar variables del Router y renderizar plantilla
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/routers.yml"

    - name: Generar archivo de configuracion del Router
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/router_c8200l.j2"
        dest: "{{ playbook_dir }}/../rendered/router_pt.cfg"
        mode: "0644"
