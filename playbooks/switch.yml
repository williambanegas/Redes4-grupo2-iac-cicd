---
- name: Configurar Switch Cisco Catalyst C9200L
  hosts: switches
  gather_facts: false

  tasks:
    - name: Crear VLANs desde variables YAML
      cisco.ios.ios_vlans:
        config: "{{ vlans }}"
        state: merged

    - name: Aplicar plantilla Jinja2 (hostname, interfaces y OSPF)
      cisco.ios.ios_config:
        src: ../templates/switch_c9200l.j2
        save_when: modified