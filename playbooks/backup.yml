---
- name: Respaldar configuracion original de C8200L y C9200L
  hosts: all
  gather_facts: false

  tasks:
    - name: Ejecutar show running-config
      cisco.ios.ios_command:
        commands:
          - show running-config
      register: config_output

    - name: Guardar respaldo en carpeta backups
      ansible.builtin.copy:
        content: "{{ config_output.stdout[0] }}"
        dest: "../backups/{{ inventory_hostname }}_original.cfg"
        mode: "0644"
      delegate_to: localhost